services:
  - type: web
    name: hr-flow-ai-backend-v2
    runtime: node
    rootDir: backend
    buildCommand: rm -rf node_modules package-lock.json && rm -rf node_modules/sqlite3 && npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: npm_config_build_from_source
        value: "true"
