services:
  - type: web
    name: hr-flow-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: rm -rf node_modules && npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
